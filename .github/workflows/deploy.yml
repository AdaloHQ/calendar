name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 13
      - name: Installing dependencies
        # --ignore-engines: devDependencies (eslint@8) now require Node >=16, but
        # this job runs on Node 13. eslint is lint-only and unused by `adalo
        # publish`, so skip the engine gate rather than block the publish. This
        # mirrors the production build server, which also installs with
        # --ignore-engines.
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Incrementing package version
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup .adalorc
        run: echo "${TOKEN}" > ~/.adalorc
        env:
          TOKEN: ${{secrets.LIBRARY_DEPLOY_TOKEN}}
      - name: Print token
        run: cat ~/.adalorc
      - name: Push to Component Registry
        run: npx adalo publish
